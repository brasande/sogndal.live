proxy_cache_path /var/cache/nginx/adsb levels=1 keys_zone=adsb:1m max_size=10m inactive=1m;
proxy_cache_path /var/cache/nginx/met levels=1 keys_zone=met:1m max_size=20m inactive=2h;

map $sent_http_content_type $static_cache {
    default                       "no-cache";
    ~font/                        "public, max-age=31536000, immutable";
    ~image/                       "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;


    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Sikkerheitsheaderar. CSP listar alle eksterne kjelder sida faktisk brukar.
    set $csp "default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://kamera.atlas.vegvesen.no; font-src 'self'; connect-src 'self' https://api.entur.io https://tiles.openfreemap.org https://tiles.mapterhorn.com https://*.goatcounter.com; worker-src 'self' blob:; child-src blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control $static_cache;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # adsb.lol sender ikkje CORS-headerar, så nettlesaren hentar via denne proxyen.
    # 5 s cache gjer at alle besøkjande deler eitt kall.
    location /adsb/ {
        proxy_pass https://api.adsb.lol/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.adsb.lol;
        proxy_set_header User-Agent "sogndal.live (+https://sogndal.live)";
        proxy_set_header Cookie "";
        proxy_cache adsb;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
    }

    # Allemannsdata (vegmeldingar, flytavle). Utan proxy svarar vegmeldings-API-et tomt
    # på kall frå nettlesarar (med Origin-header), så vi hentar via serveren og cachar.
    location /ad/ {
        proxy_pass https://allemannsdata.com/wiki/api/v1/kilder/;
        proxy_ssl_server_name on;
        proxy_set_header Host allemannsdata.com;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header User-Agent "sogndal.live (+https://sogndal.live)";
        proxy_cache met;
        proxy_cache_valid 200 2m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header X-Cache $upstream_cache_status;
    }

    # MET Norge krev at klienten identifiserer seg med User-Agent og respekterer cachen deira.
    # Proxyen set eigen User-Agent og cachar etter Expires frå MET (minst 10 min).
    location /met/ {
        proxy_pass https://api.met.no/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.met.no;
        proxy_set_header User-Agent "sogndal.live/1.0 (+https://sogndal.live)";
        proxy_set_header Cookie "";
        proxy_cache met;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status;
    }
}
